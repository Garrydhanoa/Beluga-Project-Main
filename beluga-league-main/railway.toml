# Railway deployment configuration for the Beluga League website

[build]
builder = "NIXPACKS"

[deploy]
# Bind to all interfaces so Railway can route traffic to the app.
startCommand = "next start -H 0.0.0.0 -p ${PORT:-3000}"
healthcheckPath = "/"
# ALWAYS, not ON_FAILURE: a process that exits cleanly (code 0) after a crash-path
# shutdown must still come back. ON_FAILURE is why the bot stayed down after a
# database blip on 2026-08-23.
restartPolicyType = "ALWAYS"
