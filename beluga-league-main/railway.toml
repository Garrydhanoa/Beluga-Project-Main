# Railway deployment configuration for the Beluga League website

[build]
builder = "NIXPACKS"

[deploy]
# Bind to all interfaces so Railway can route traffic to the app.
startCommand = "next start -H 0.0.0.0 -p ${PORT:-3000}"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
