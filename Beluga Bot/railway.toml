# Railway Deployment Configuration
# This file tells Railway how to build and start your Discord bot

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm start"
# ALWAYS, not ON_FAILURE: a process that exits cleanly (code 0) after a crash-path
# shutdown must still come back. ON_FAILURE is why the bot stayed down after a
# database blip on 2026-08-23.
restartPolicyType = "ALWAYS"

# Environment variables (these need to be set in Railway dashboard)
# DISCORD_TOKEN
# APPLICATION_ID 
# GUILD_ID
# GOOGLE_CREDENTIALS (JSON string)
# SHEET_ID_AA
# SHEET_ID_AAA
# SHEET_ID_MAJORS
